<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coletas — BRASIL+</title>
<style>
  :root {
    --azul: #2F6FED;
    --marinho: #1D2939;
    --cinza: #667085;
    --linha: #E4E7EC;
    --fundo: #FFFFFF;
    --suave: #F5F7FA;
    --ok: #1BAF7A;
    --erro: #D92D20;
    --aviso: #F5A524;
    --parado: #98A2B3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --marinho: #E4E7EC; --cinza: #98A2B3; --linha: #344054; --fundo: #101828; --suave: #1D2939;
    }
  }
  :root[data-theme="dark"] {
    --marinho: #E4E7EC; --cinza: #98A2B3; --linha: #344054; --fundo: #101828; --suave: #1D2939;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--marinho);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--cinza); font-size: 13px; }
  button {
    font: inherit; font-size: 14px; color: #fff; background: var(--azul); border: 0;
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { border: 1px solid var(--linha); border-radius: 12px; padding: 14px 16px; background: var(--suave); }
  .kpi b { display: block; font-size: 26px; line-height: 1.2; }
  .kpi span { color: var(--cinza); font-size: 13px; }
  .kpi.ok b { color: var(--ok); }
  .kpi.erro b { color: var(--erro); }
  .kpi.aviso b { color: var(--aviso); }
  .kpi.parado b { color: var(--parado); }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabela th { text-align: left; color: var(--cinza); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--linha); }
  .tabela td { padding: 9px 10px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  .tabela td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: #E7F8F1; color: #0F7A55; }
  .tag.erro { background: #FDECEA; color: #B42318; }
  .tag.aviso { background: #FFF4E0; color: #A05A00; }
  .tag.parado { background: #F2F4F7; color: #475467; }
  .erro-txt { color: var(--erro); font-size: 12px; word-break: break-word; }
  .aviso-txt { color: var(--cinza); font-size: 12px; margin-top: 12px; }
  .vazio { color: var(--cinza); padding: 16px 0; }
  .tabela-wrap { overflow-x: auto; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 8px 0 4px; }
  .form label { display: grid; gap: 4px; font-size: 13px; color: var(--cinza); }
  .form label.largo { grid-column: 1 / -1; }
  .form label.check { display: flex; align-items: center; gap: 8px; }
  .form input, .form select { font: inherit; font-size: 14px; color: var(--marinho); background: var(--fundo);
    border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; }
  .form .acoes { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--linha); }
  @media (max-width: 640px) {
    .tabela .oculto-celular { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Coletas do BRASIL+</h1>
      <div class="sub" id="atualizado">Carregando…</div>
    </div>
    <button id="atualizar" type="button">Atualizar</button>
  </header>

  <div class="kpis" id="kpis"></div>

  <h2>Cadastrar fonte</h2>
  <form id="form-fonte" class="form" autocomplete="off">
    <label>Nome <input name="nome" required maxlength="64" placeholder="ex.: senado-senadores"></label>
    <label>Produto <input name="produto" value="BRASIL+" maxlength="60"></label>
    <label class="largo">Endereço (https) <input name="url" required type="url" placeholder="https://..."></label>
    <label>Intervalo (minutos) <input name="intervalo_min" type="number" value="1440" min="5" max="43200"></label>
    <label>Formato
      <select name="formato">
        <option value="json">JSON</option><option value="csv">CSV (em breve)</option>
        <option value="xml">XML (em breve)</option><option value="zip">ZIP (em breve)</option>
      </select>
    </label>
    <label>Campo que identifica a linha <input name="chave" required placeholder="ex.: id"></label>
    <label>Campo do valor <input name="valor"></label>
    <label>Campo do título <input name="titulo"></label>
    <label>Campo da UF <input name="uf"></label>
    <label>Campo da data <input name="data"></label>
    <label>Lista dentro do arquivo <input name="lista" placeholder="ex.: dados (se houver)"></label>
    <label class="largo check"><input type="checkbox" name="permitir_pessoas"> Esta fonte traz dados de pessoas (nome, CPF...)</label>
    <label class="largo">Chave do administrador <input name="token" type="password" required></label>
    <div class="acoes"><button type="submit">Cadastrar</button><span id="form-msg" class="sub"></span></div>
  </form>

  <h2>Fontes cadastradas</h2>
  <div class="tabela-wrap">
    <table class="tabela">
      <thead><tr><th>Nome</th><th>Formato</th><th>Intervalo</th><th>Situação</th><th></th></tr></thead>
      <tbody id="cadastradas"></tbody>
    </table>
  </div>

  <h2>Fontes</h2>
  <div class="tabela-wrap">
    <table class="tabela">
      <thead>
        <tr><th>Tarefa</th><th>Situação</th><th class="oculto-celular">Última coleta boa</th><th class="num oculto-celular">Horas desde</th><th class="oculto-celular">Itens</th></tr>
      </thead>
      <tbody id="fontes"></tbody>
    </table>
  </div>
  <div class="aviso-txt" id="aviso"></div>

  <h2>Últimas execuções</h2>
  <div class="tabela-wrap">
    <table class="tabela">
      <thead>
        <tr><th>Tarefa</th><th>Resultado</th><th class="oculto-celular">Início</th><th class="num oculto-celular">Itens</th></tr>
      </thead>
      <tbody id="coletas"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ROTULO = {
    ok: ["Em dia", "ok"],
    falhando: ["Falhando", "erro"],
    sem_coleta_boa: ["Sem coleta boa", "aviso"],
    nunca_coletada: ["Nunca rodou", "parado"]
  };
  var ORDEM = { falhando: 0, sem_coleta_boa: 1, nunca_coletada: 2, ok: 3 };

  function el(tag, texto, classe) {
    var e = document.createElement(tag);
    if (texto !== undefined && texto !== null) e.textContent = texto;
    if (classe) e.className = classe;
    return e;
  }

  function tag(situacao) {
    var r = ROTULO[situacao] || ["—", "parado"];
    return el("span", r[0], "tag " + r[1]);
  }

  function horas(h) {
    if (h === null || h === undefined) return "—";
    if (h < 1) return "menos de 1 h";
    if (h < 48) return Math.round(h) + " h";
    return Math.round(h / 24) + " dias";
  }

  function hora(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function kpi(classe, numero, rotulo) {
    var c = el("div", null, "kpi " + classe);
    c.append(el("b", String(numero)), el("span", rotulo));
    return c;
  }

  function pintarResumo(r) {
    var k = document.getElementById("kpis");
    k.replaceChildren(
      kpi("ok", r.ok || 0, "em dia"),
      kpi("erro", r.falhando || 0, "falhando"),
      kpi("aviso", r.sem_coleta_boa || 0, "sem coleta boa"),
      kpi("parado", r.nunca_coletada || 0, "nunca rodou")
    );
  }

  function pintarFontes(lista) {
    var corpo = document.getElementById("fontes");
    corpo.replaceChildren();
    if (!lista.length) {
      var v = el("tr"); var td = el("td", "Nenhuma fonte configurada.", "vazio"); td.colSpan = 5; v.append(td); corpo.append(v);
      return;
    }
    lista.slice().sort(function (a, b) {
      return (ORDEM[a.situacao] - ORDEM[b.situacao]) || a.tarefa.localeCompare(b.tarefa);
    }).forEach(function (f) {
      var tr = el("tr");
      var t1 = el("td", f.tarefa);
      var t2 = el("td");
      t2.append(tag(f.situacao));
      if (f.ultimo_erro) t2.append(el("div", f.ultimo_erro, "erro-txt"));
      var t3 = el("td", hora(f.ultima_ok), "oculto-celular");
      var t4 = el("td", horas(f.horas_desde_ok), "num oculto-celular");
      var t5 = el("td", f.itens_ultima_ok === undefined || f.itens_ultima_ok === null ? "—" : String(f.itens_ultima_ok), "num oculto-celular");
      tr.append(t1, t2, t3, t4, t5);
      corpo.append(tr);
    });
  }

  function pintarColetas(lista) {
    var corpo = document.getElementById("coletas");
    corpo.replaceChildren();
    if (!lista.length) {
      var v = el("tr"); var td = el("td", "Nenhuma execução ainda.", "vazio"); td.colSpan = 4; v.append(td); corpo.append(v);
      return;
    }
    lista.forEach(function (c) {
      var tr = el("tr");
      var nome = c.fonte + " · " + c.tarefa;
      var resultado = el("td");
      var situ = c.status === "ok" ? "ok" : c.status === "parcial" ? "aviso" : "erro";
      var rot = { ok: "Concluída", parcial: "Parcial", erro: "Erro", abortada: "Abortada", rodando: "Rodando" }[c.status] || c.status;
      resultado.append(el("span", rot, "tag " + situ));
      if (c.erro) resultado.append(el("div", c.erro, "erro-txt"));
      tr.append(el("td", nome), resultado, el("td", hora(c.inicio), "oculto-celular"),
                el("td", c.itens === null || c.itens === undefined ? "—" : String(c.itens), "num oculto-celular"));
      corpo.append(tr);
    });
  }

  function marcarErro(msg) {
    document.getElementById("atualizado").textContent = msg;
  }

  async function pegar(caminho) {
    var r = await fetch(caminho, { cache: "no-store", headers: { "Accept": "application/json" } });
    if (!r.ok) throw new Error(caminho + " respondeu " + r.status);
    return r.json();
  }

  async function carregar() {
    try {
      var [status, coletas] = await Promise.all([pegar("/fontes/status"), pegar("/coletas?limit=30")]);
      pintarResumo(status.resumo || {});
      pintarFontes(status.fontes || []);
      pintarColetas(coletas || []);
      document.getElementById("aviso").textContent = status.aviso || "";
      document.getElementById("atualizado").textContent = "Atualizado às " +
        new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) +
        " · atualiza sozinho a cada minuto";
    } catch (e) {
      marcarErro("Não foi possível carregar os dados. Tente de novo em instantes.");
    }
  }

  var TOKEN_KEY = "bp_admin_token";
  function tokenGuardado() { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function guardarToken(t) { try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) { /* navegador sem sessão: segue sem guardar */ } }

  async function enviarFonte(ev) {
    ev.preventDefault();
    var f = ev.target, msg = document.getElementById("form-msg");
    var d = new FormData(f), token = String(d.get("token") || "");
    var campos = {};
    ["chave", "valor", "titulo", "uf", "data", "lista"].forEach(function (k) {
      var v = String(d.get(k) || "").trim();
      if (v) campos[k === "lista" ? "lista" : k] = v;
    });
    var corpo = {
      nome: String(d.get("nome") || "").trim(), produto: String(d.get("produto") || "BRASIL+"),
      url: String(d.get("url") || "").trim(), intervalo_min: parseInt(d.get("intervalo_min"), 10) || 1440,
      formato: String(d.get("formato") || "json"), campos: campos, permitir_pessoas: d.get("permitir_pessoas") === "on"
    };
    msg.textContent = "Enviando…";
    try {
      var r = await fetch("/fontes-cadastradas", { method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Token": token }, body: JSON.stringify(corpo) });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) { msg.textContent = typeof j.detail === "string" ? j.detail : "Não foi possível cadastrar (" + r.status + ")."; return; }
      guardarToken(token);
      f.reset();
      msg.textContent = "Fonte cadastrada. O coletor pega na próxima rodada.";
      listarCadastradas();
    } catch (e) { msg.textContent = "Sem conexão com o servidor."; }
  }

  async function alternarFonte(id, ativa) {
    var msg = document.getElementById("form-msg"), token = tokenGuardado();
    if (!token) { msg.textContent = "Digite a chave do administrador no formulário acima e cadastre uma fonte para liberar esta ação."; return; }
    try {
      var r = await fetch("/fontes-cadastradas/" + id, { method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Token": token }, body: JSON.stringify({ ativa: !ativa }) });
      if (!r.ok) { msg.textContent = "Não foi possível alterar (" + r.status + ")."; return; }
      listarCadastradas();
    } catch (e) { msg.textContent = "Sem conexão com o servidor."; }
  }

  async function listarCadastradas() {
    var corpo = document.getElementById("cadastradas");
    var lista;
    try { lista = await pegar("/fontes-cadastradas"); } catch (e) { return; }
    corpo.replaceChildren();
    if (!lista.length) { var v = el("tr"), td = el("td", "Nenhuma fonte cadastrada ainda.", "vazio"); td.colSpan = 5; v.append(td); corpo.append(v); return; }
    lista.forEach(function (x) {
      var tr = el("tr");
      var botao = el("button", x.ativa ? "Pausar" : "Ativar", "secundario");
      botao.type = "button";
      botao.addEventListener("click", function () { alternarFonte(x.id, x.ativa); });
      var situ = el("td");
      situ.append(el("span", x.ativa ? "Ativa" : "Pausada", "tag " + (x.ativa ? "ok" : "parado")));
      tr.append(el("td", x.nome), el("td", x.formato.toUpperCase()), el("td", "a cada " + x.intervalo_min + " min"), situ, el("td"));
      tr.lastChild.append(botao);
      corpo.append(tr);
    });
  }

  document.getElementById("form-fonte").addEventListener("submit", enviarFonte);
  document.getElementById("atualizar").addEventListener("click", carregar);
  listarCadastradas();
  carregar();
  setInterval(carregar, 60000);
})();
</script>
</body>
</html>
