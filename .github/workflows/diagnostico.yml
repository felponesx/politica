name: Diagnóstico das fontes

# Mostra amostras das respostas brutas das fontes oficiais (formato, tempo e bloqueios).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diagnostico_ci.py

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.27.*" "openpyxl==3.1.*"
      - run: python -m scripts.diagnostico_ci
