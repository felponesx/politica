name: Diagnóstico dos diários oficiais estaduais

# Testa os 27 diários (página inicial + busca de teste) a partir do GitHub, que alcança sites que o ambiente do Claude não alcança.
# Não coleta nada. Resultado no resumo da execução e no artefato diag-diarios.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Testar os diários
        run: python -m scripts.diag_diarios diag_diarios.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Querido Diário
        run: |
          for u in "https://api.queridodiario.ok.org.br/gazettes?size=1" "https://api.queridodiario.org.br/gazettes?size=1" "https://api.queridodiario.ok.org.br/cities?levels=3"; do
            echo "$(curl -sL -m 40 -o /dev/null -w '%{http_code}' "$u") $u" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-diarios
          path: diag_diarios.json
          retention-days: 14
