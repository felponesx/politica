name: Coletar dados oficiais

# Roda as coletas nos servidores do GitHub (que acessam as fontes oficiais) e grava em site/dados uma cópia
# estática da API. O site usa essa cópia quando é aberto sem servidor (link publicado, GitHub Pages).
# Para rodar de novo: aba Actions > "Coletar dados oficiais" > Run workflow.

on:
  workflow_dispatch:
    inputs:
      tarefas:
        description: "Tarefas separadas por ponto e vírgula (ex.: tse-resultados ano=2022 uf=SP). Vazio = carga inicial completa."
        required: false
        default: ""
      banco:
        description: "Chave do cache do banco para começar (ex.: banco-38270264957). Vazio = o mais recente."
        required: false
        default: ""
  # as notícias têm robô próprio e rápido (noticias.yml); este fica livre para a carga completa
  push:
    paths:
      - .github/workflows/coletar-dados.yml
      - scripts/coleta_ci.py

permissions:
  contents: write

concurrency:
  group: coletar-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brasil
          POSTGRES_PASSWORD: brasil
          POSTGRES_DB: brasilplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brasil -d brasilplus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://brasil:brasil@localhost:5432/brasilplus
      TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      TAREFAS: ${{ inputs.tarefas }}
      PYTHONUNBUFFERED: "1"
      CNPJ_INTERVALO: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # o banco da coleta anterior volta do cache: rodar só algumas tarefas (campo "tarefas") não apaga o resto
      - name: Restaurar o banco da coleta anterior
        id: banco
        uses: actions/cache/restore@v4
        with:
          path: banco.dump
          key: banco-${{ github.run_id }}
          restore-keys: ${{ inputs.banco || 'banco-' }}
      # pediu um banco específico e ele não está no cache: para aqui (seguir com o banco vazio apagaria o site)
      - name: Conferir o banco pedido
        if: inputs.banco != '' && steps.banco.outputs.cache-matched-key != inputs.banco
        run: |
          echo "::error::O banco ${{ inputs.banco }} não está no cache (achou: '${{ steps.banco.outputs.cache-matched-key }}')."
          exit 1
      - name: Carregar o banco anterior
        if: steps.banco.outputs.cache-matched-key != ''
        run: |
          pg_restore --no-owner --no-privileges -d "postgresql://brasil:brasil@localhost:5432/brasilplus" banco.dump || true
          touch .banco_carregado
      - name: Coletar
        run: python -m scripts.coleta_ci coletar
      - name: Resumo das coletas
        if: always()
        run: python -m scripts.coleta_ci resumo | tee -a "$GITHUB_STEP_SUMMARY"
      # história e imagem de cada título de Prêmios (Wikipédia): só o que falta; pedindo "premios" nas tarefas ou na carga completa
      - name: Prêmios (história e imagens)
        if: env.TAREFAS == '' || contains(env.TAREFAS, 'premios')
        run: |
          python -m scripts.premios_wiki site/midia || echo "Premios nao atualizados nesta coleta."
      - name: Gerar a cópia estática da API
        run: python -m scripts.exportar_snapshot site/dados
      # fotos oficiais e logos (o site publicado não carrega imagens de fora): na carga completa ou se pedido
      - name: Fotos e logos para o site
        if: env.TAREFAS == '' || contains(env.TAREFAS, 'midia')
        run: |
          # na carga completa, só refaz se o último conjunto tem mais de 7 dias (pedindo "midia" nas tarefas, sempre refaz)
          if [ -z "$TAREFAS" ] && ! python -m scripts.coleta_ci midia-atrasada; then
            echo "Fotos e logos atualizados há menos de 7 dias; pulados."; exit 0
          fi
          python -m scripts.midia_site site/midia || echo "Fotos e logos não atualizados nesta coleta."
      # grava num arquivo temporário: um dump interrompido nunca vai para o cache (a próxima coleta usaria um
      # banco vazio). Se a coleta foi cancelada, guarda o que já tinha sido gravado.
      - name: Guardar o banco para a próxima coleta
        id: dump
        if: always() && steps.banco.outcome == 'success'
        run: |
          # cancelada no meio da carga do banco anterior: o banco está pela metade e não pode virar o próximo ponto de partida
          if [ -n "${{ steps.banco.outputs.cache-matched-key }}" ] && [ ! -f .banco_carregado ]; then
            echo "::warning::Banco anterior não foi carregado inteiro; não guardo esta cópia."; exit 1
          fi
          pg_dump -Fc -Z6 -f banco.tmp "postgresql://brasil:brasil@localhost:5432/brasilplus"
          test "$(stat -c %s banco.tmp)" -gt 1000000
          mv banco.tmp banco.dump
      - uses: actions/cache/save@v4
        if: always() && steps.dump.outcome == 'success'
        with:
          path: banco.dump
          key: banco-${{ github.run_id }}
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/dados site/midia app/dados/premios_wiki.json
          git commit -q -m "Dados oficiais: cópia de $(date -u +%d/%m/%Y)" || { echo "Nada mudou."; exit 0; }
          for i in 1 2 3; do
            # outra coleta pode ter gravado a cópia no meio do caminho: vale a desta (gerada do banco mais recente)
            git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
