name: Diagnóstico Overpass

on:
  workflow_dispatch:
  push:
    paths:
      - scripts.diag_overpass.py

permissions:
  contents: read

jobs:
  overpass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.27.*" "openpyxl==3.1.*"
      - run: python -m scripts.diag_overpass
