name: Notícias (rápido)

# Lê os feeds dos veículos a cada 15 minutos e grava site/dados/noticias.json (scripts/noticias_rapido.py).
# Não usa banco: leva cerca de 1 minuto e só faz commit quando chega matéria nova. O robô pesado
# (coletar-dados.yml) fica livre para a carga completa. O GitHub pode atrasar o agendamento em horários de pico.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - .github/workflows/noticias.yml
      - scripts/noticias_rapido.py
      - app/collectors/noticias.py
      - app/escandalos.py

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ler os feeds
        run: python -m scripts.noticias_rapido site/dados
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados/noticias.json
          git commit -q -m "Notícias: atualização de $(date -u +%H:%M) UTC [skip ci]" || { echo "Nada novo."; exit 0; }
          for i in 1 2 3; do
            # o robô pesado pode ter gravado no meio do caminho: vale o arquivo mais novo deste robô
            git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
