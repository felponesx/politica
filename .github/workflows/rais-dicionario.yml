name: RAIS dicionário (nomes das ocupações e cabeçalho de outros anos)

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos para conferir o cabeçalho (separados por espaço)"
        required: false
        default: "2024 2023"

permissions:
  contents: read

jobs:
  dicionario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "py7zr==1.*" "xlrd==2.*"
      - name: Ler o dicionário e os cabeçalhos
        run: python -m scripts.rais_dicionario ${{ inputs.anos }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbo-rais
          path: app/dados/cbo_rais.json
          if-no-files-found: warn
          retention-days: 30
