name: Revisão dos dados

# Agente de revisão (scripts/revisar_dados.py): confere a cópia publicada em site/dados — datas, somas que precisam fechar,
# contadores contra a fonte ao vivo, escândalos sem fonte — e grava site/dados/revisao.json. Não corrige nada: o resumo
# aparece nesta página da execução e o robô falha (e-mail do GitHub) quando acha um "erro".
# Rode pelo botão com "urls" ligado para conferir também os links de fonte dos escândalos (demora alguns minutos).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Conferir também os links de fonte dos escândalos"
        type: boolean
        default: false
  schedule:
    - cron: "23 9 * * *"
  push:
    paths:
      - .github/workflows/revisao.yml
      - scripts/revisar_dados.py

permissions:
  contents: write

concurrency:
  group: revisao
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar os dados
        id: revisar
        continue-on-error: true
        run: |
          # aos domingos confere também os links dos escândalos
          EXTRA=""
          if [ "${{ inputs.urls }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then EXTRA="--urls"; fi
          python -m scripts.revisar_dados site/dados $EXTRA | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Gravar o relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados/revisao.json
          git commit -q -m "Revisão dos dados: relatório de $(date -u +%d/%m/%Y) [skip ci]" || { echo "Nada mudou."; exit 0; }
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      - name: Avisar se houve erro
        if: steps.revisar.outcome == 'failure'
        run: |
          echo "::error::A revisão encontrou erros nos dados. Veja o resumo desta execução."; exit 1
