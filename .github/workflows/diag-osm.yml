name: Diagnóstico OpenStreetMap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.27.*"
      - run: python -m scripts.diag_osm
