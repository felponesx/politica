name: Diagnóstico INEP

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diag_inep.py

permissions:
  contents: read

jobs:
  inep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.27.*" certifi "openpyxl==3.1.*"
      - run: python -m scripts.diag_inep
