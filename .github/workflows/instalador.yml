name: Instalador do Windows

# Gera BRASILMais-Setup.exe e publica numa Release. Rode pelo botao (Run workflow, informando a versao, ex.: 1.0.0)
# ou crie uma tag vX.Y.Z. O programa instalado confere a Release a cada 6 h e se atualiza sozinho.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao (ex.: 1.0.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: instalador
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.versao }}"
          if (-not $ver) { $ver = "${{ github.ref_name }}" }
          $ver = $ver.TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Versao invalida: $ver" }
          "versao=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Set-Content -Path app\versao.py -Value ('"""Versao do programa (trocada pelo instalador)."""' + "`nVERSAO = `"$ver`"") -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliotecas
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Gerar o programa
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --name BRASILMais --onedir --noconsole `
            --paths coletor --distpath build-exe\dist --workpath build-exe\obra --specpath build-exe\obra `
            --collect-submodules uvicorn --collect-submodules alembic --collect-submodules apscheduler `
            --collect-submodules app --collect-submodules scripts --collect-submodules pystray `
            --add-data "$PWD\app\dados;app/dados" --add-data "$PWD\app\static;app/static" `
            --add-data "$PWD\migrations;migrations" --add-data "$PWD\alembic.ini;." `
            --add-data "$PWD\coletor\vinculos;coletor/vinculos" `
            executavel.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller falhou" }

      - name: Teste do programa gerado (abre de verdade e responde)
        shell: pwsh
        run: |
          $exe = (Resolve-Path build-exe\dist\BRASILMais\BRASILMais.exe).Path
          $v = (& $exe --versao | Out-String).Trim()
          Write-Host "versao do exe: [$v] (a tela fica sem console; vazio e normal)"
          $base = Join-Path $env:RUNNER_TEMP "teste-base"
          $p = Start-Process -FilePath $exe -ArgumentList "--sem-navegador","--sem-bandeja","--base",$base -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/pronto -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if ($ok) { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/painel; Write-Host "painel: $($r.StatusCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path "$base\logs\brasilplus.log") { Get-Content "$base\logs\brasilplus.log" -Tail 40 }
          if (-not $ok) { throw "O programa gerado nao respondeu em /pronto" }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersao=${{ steps.v.outputs.versao }}" instalar\BRASILMais.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }
          $h = (Get-FileHash saida\BRASILMais-Setup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path saida\BRASILMais-Setup.exe.sha256 -Value "$h  BRASILMais-Setup.exe" -Encoding ascii
          Write-Host "sha256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: BRASILMais-Setup
          path: saida/*
          retention-days: 14

      - name: Publicar a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.v.outputs.versao }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --target ${{ github.sha }} --title "BRASIL+ $tag" --notes "Instalador do Windows. Baixe BRASILMais-Setup.exe." }
          gh release upload $tag saida\BRASILMais-Setup.exe saida\BRASILMais-Setup.exe.sha256 --clobber
