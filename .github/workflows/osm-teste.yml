name: Teste da malha viária (Overpass e extrato da Geofabrik)

# Prova, com fontes reais e PostgreSQL de serviço, as duas coletas de malha viária. Não toca no banco do robô de coleta.
on:
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs das capitais (ex.: TO,DF)"
        default: "TO"

permissions:
  contents: read

jobs:
  malha:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brasil
          POSTGRES_PASSWORD: brasil
          POSTGRES_DB: brasilplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brasil -d brasilplus"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://brasil:brasil@localhost:5432/brasilplus
      PYTHONUNBUFFERED: "1"
      UFS: ${{ inputs.ufs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Overpass (em partes)
        continue-on-error: true
        run: python -m scripts.coletar osm-malha-capitais "ufs=$UFS" refazer=true 2>&1 | grep -v "HTTP Request" | tail -25
      - name: Extrato da Geofabrik (PBF)
        run: python -m scripts.coletar osm-malha-pbf "ufs=$UFS" manter=true 2>&1 | grep -v "HTTP Request" | tail -25
      - name: Resultado no PostgreSQL
        run: python -m scripts.diag_osm_resultado
