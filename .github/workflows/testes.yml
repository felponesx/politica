name: Testes

# Roda os testes em cada pedido de mudança (pull request). Serve para você aprovar pelo celular só o que está verde.
# O PC também roda os testes antes de aplicar qualquer atualização (scripts/atualizar_local.py).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./teste.db
