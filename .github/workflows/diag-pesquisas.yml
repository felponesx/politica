name: Diagnóstico pesquisas

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diag_pesquisas.py

permissions:
  contents: read

jobs:
  pesquisas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.27.*"
      - run: python -m scripts.diag_pesquisas
