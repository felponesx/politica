name: Diagnóstico sanções

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diag_sancoes.py

permissions:
  contents: read

jobs:
  sancoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "httpx==0.27.*"
      - run: python -m scripts.diag_sancoes
