# Vínculo/produto BRASIL+. Cada [[fonte]] é um bot. Para somar links, crie outro arquivo com o mesmo `nome`.
nome = "BRASIL+"

# Câmara dos Deputados: deputados (paginado, segue o link "next")
[[fonte]]
nome = "camara"
url = "https://dadosabertos.camara.leg.br/api/v2/deputados?itens=100&ordem=ASC&ordenarPor=id"
intervalo_min = 15          # votações e deputados mudam ao longo do dia
paginacao = "camara"
headers = { Accept = "application/json" }
esperado = "Lista de deputados federais em exercício, com id, nome, partido e UF."

# Banco Central, SGS série 433 (IPCA mensal)
[[fonte]]
nome = "bcb"
url = "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados?formato=json"
intervalo_min = 360         # série diária/mensal
publicar_dados = true       # entrega o último dado LIBERADO ao repositório (só fontes de um arquivo, pequenas)
esperado = "Série mensal do IPCA: lista de {data, valor}, valores percentuais em torno de -1 a 5."

# TSE: candidatos 2022 (ZIP grande, baixado em streaming)
[[fonte]]
nome = "tse"
url = "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2022.zip"
intervalo_min = 1440        # arquivo grande, muda raramente
