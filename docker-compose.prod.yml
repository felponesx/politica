# Produção: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Serviços: banco (sem porta pública), API (usuário só leitura), agendador (coletas + migrações),
# Caddy (HTTPS automático no seu domínio) e backup diário.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: brasil
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env.prod}
      POSTGRES_DB: brasilplus
      DB_LEITURA_SENHA: ${DB_LEITURA_SENHA:?defina DB_LEITURA_SENHA no .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasil -d brasilplus"]
      interval: 10s
      retries: 10

  agendador:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "scripts.agendar"]
    environment:
      DATABASE_URL: postgresql+psycopg://brasil:${DB_SENHA}@db:5432/brasilplus
      TRANSPARENCIA_API_KEY: ${TRANSPARENCIA_API_KEY:-}
      ALERTA_TELEGRAM_TOKEN: ${ALERTA_TELEGRAM_TOKEN:-}
      ALERTA_TELEGRAM_CHAT: ${ALERTA_TELEGRAM_CHAT:-}
      ALERTA_WEBHOOK_URL: ${ALERTA_WEBHOOK_URL:-}
    volumes: [coletas_tmp:/tmp]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://brasil_leitura:${DB_LEITURA_SENHA}@db:5432/brasilplus
      MIGRAR_AO_INICIAR: "false"
      SOMENTE_LEITURA: "true"
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      LIMITE_REQ_POR_MINUTO: ${LIMITE_REQ_POR_MINUTO:-120}
      # redes do Docker onde está o Caddy: só delas vale o X-Forwarded-For (o Caddy sobrescreve o que o cliente mandar)
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      IA_ORCAMENTO_DIA_USD: ${IA_ORCAMENTO_DIA_USD:-5}
    # a API só lê: sistema de arquivos somente leitura, sem privilégios extras
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: {condition: service_healthy}
      agendador: {condition: service_started}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env.prod}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_SENHA}
    volumes:
      - ./backups:/backups
      - ./infra/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  caddy_data:
  coletas_tmp:
